name: Bug report
description: Something in talon behaves incorrectly
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more precise the report,
        the faster it can be reproduced and fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe? Include the exact error output if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `talon ...`
        2. Observe ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: talon version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output from the audit log or terminal, if available.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this
          required: true
        - label: I did not include any secrets, tokens, or private data above
          required: true